name: Validate Cloudflare GMC MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck remote Worker
        run: npm run typecheck:worker
      - name: Package Cloudflare Worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir /tmp/merchant-worker
