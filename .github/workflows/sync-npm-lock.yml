name: Synchronize npm lockfile
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .npmrc
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile using the Cloudflare install settings
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Commit the regenerated lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync npm lockfile for Cloudflare clean-install"
          git push
